  detail: >-
    Agripedia ships software only as closed end-user applications: its corporate site is a two-route
    Nuxt SPA (sitemap lists exactly / and /news) with no developer, docs, portal or integration link
    anywhere, kanri.agripedia.co.jp (AP管理システム) answers every path with a 401 "please register or
    sign in" body or a 302 to /users/sign_in, and connect.agripedia.co.jp calls itself "AgriPedia
    社内向けSCMシステム" — an internal supply-chain tool — in its own meta description, so there is no
    public API being marketed and nothing gated behind a sales form either.
