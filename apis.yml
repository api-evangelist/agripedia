aid: agripedia
name: Agripedia
description: >-
  Agripedia (アグリぺディア株式会社) is a Tokyo agricultural technology company, founded in June 2019 and
  headquartered in Nishi-Gotanda, Shinagawa-ku, that connects mid- and large-scale Japanese farms and
  production areas with food-service and food-manufacturing buyers. It supports growers from GAP
  certification through to the sale of the certified produce, runs a B2B direct-sales channel for
  GAP-certified commercial agricultural products, sells crop-protection materials and fertilizer, and
  operates its own production management system for cultivation history and traceability. It holds JGAP
  group certification (March 2023) and is a GAP partner of Japan's Ministry of Agriculture, Forestry and
  Fisheries. Its software reaches farms, buyers and staff as closed, credentialed web applications; the
  company publishes no developer program, no public API, and no machine-readable contract on any host it
  operates.
